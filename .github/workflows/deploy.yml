# 운영 자동 배포 (CD): main에 push → CI 성공 → 이 워크플로가 EC2에 배포
#
#   git push main ─▶ CI(ci.yml) 성공 ─▶ Deploy(이 파일)
#                                        1) GitHub OIDC 토큰 → AWS IAM 역할 (장기 Access Key 없음)
#                                        2) SSM Run Command → EC2에서 git reset + docker compose up --build
#                                        3) https://<API_DOMAIN>/health 가 200인지 확인
#
# - SSH 포트(22)를 GitHub에 열지 않는다: EC2의 SSM Agent가 AWS로 "바깥으로" 연결해서 명령을 받아온다.
# - 수동 배포/롤백: Actions → Deploy → Run workflow (ref에 main 커밋 SHA를 넣으면 그 커밋으로 배포).
# 자세한 설명: docs/deploy.md 「자동 배포 (CD)」

name: Deploy

on:
  # CI 워크플로가 끝나면 실행된다 (성공/실패 모두 이벤트가 오므로 아래 job의 if로 "main push + 성공"만 거른다)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 수동 실행 (재배포, 롤백)
  workflow_dispatch:
    inputs:
      ref:
        description: '배포할 main의 커밋 SHA (비우면 main 최신). 롤백할 때 예전 SHA를 넣는다'
        required: false
        default: ''

# 배포는 한 번에 하나만. 진행 중인 배포를 중간에 끊지 않는다 (cancel-in-progress: false)
concurrency:
  group: deploy-production
  cancel-in-progress: false

# id-token: write → GitHub가 이 job에 OIDC 토큰을 발급해 줌 (AWS가 "이 저장소의 main에서 온 요청"임을 확인)
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  # 계정 ID/ARN/인스턴스 ID는 비밀값이 아니다 (권한은 IAM 정책이 막는다)
  AWS_ROLE_ARN: arn:aws:iam::071732232414:role/backend-visualized-github-deploy
  INSTANCE_ID: i-0c7a663e814fc808d
  APP_DIR: /opt/backend-visualized
  HEALTH_URL: https://3-35-59-193.sslip.io/health

jobs:
  deploy:
    name: Deploy API to EC2 (SSM)
    # 수동 실행이거나, "main에 push"로 돈 CI가 성공했을 때만
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1) 어떤 커밋을 배포할지 정한다. 입력값은 셸에 넣기 전에 형식을 검사한다 (명령 주입 방지)
      - name: Resolve target commit
        id: target
        env:
          INPUT_REF: ${{ inputs.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="$RUN_SHA"                 # CI가 검사한 바로 그 커밋
          elif [ -n "$INPUT_REF" ]; then
            sha="$INPUT_REF"               # 수동: 지정한 커밋 (롤백)
          else
            sha="main"                     # 수동: main 최신
          fi
          if ! printf '%s' "$sha" | grep -Eq '^([0-9a-f]{7,40}|main)$'; then
            echo "::error::ref는 main 또는 커밋 SHA(16진수 7~40자)여야 합니다: $sha"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "배포 대상: $sha"

      # 2) OIDC로 AWS 임시 자격 증명 받기 (1시간짜리, 저장소에 Access Key를 둘 필요 없음)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-deploy-${{ github.run_id }}

      # 3) SSM Run Command로 서버에서 배포 명령 실행
      #    - git reset --hard: 서버 checkout은 "main을 그대로 비추는 거울"이어야 한다.
      #      deploy/production.env(비밀값)는 .gitignore 대상이라 reset/clean의 영향을 받지 않는다.
      #      서버에서 직접 고친 파일이 있으면 사라지므로, 고칠 건 반드시 저장소에 커밋한다.
      #    - merge-base --is-ancestor: main에 없는 커밋(다른 브랜치)은 배포하지 않는다
      - name: Run deploy on EC2 via SSM
        id: ssm
        env:
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          # TARGET은 위에서 형식 검사를 통과한 값(main 또는 16진수 SHA)이라 명령에 넣어도 안전하다
          if [ "$TARGET" = main ]; then ref=origin/main; else ref="$TARGET"; fi

          # 서버(ubuntu 사용자)에서 순서대로 실행할 명령들. 하나라도 실패하면 멈춘다 (set -euo pipefail)
          steps=(
            "set -euo pipefail"
            "cd $APP_DIR"
            "git fetch --prune origin main"
            "target=\$(git rev-parse --verify $ref^{commit})"
            "git merge-base --is-ancestor \$target origin/main || { echo \"\$target is not on origin/main\"; exit 1; }"
            "echo before=\$(git rev-parse --short HEAD) target=\$(git rev-parse --short \$target)"
            "git reset --hard \$target"
            "./deploy/compose.sh up -d --build"
            "docker image prune -f"
            "./deploy/compose.sh ps"
            "echo DEPLOYED_SHA=\$(git rev-parse HEAD)"
          )
          joined=$(printf '%s; ' "${steps[@]}")
          # AWS-RunShellScript는 root로 실행된다 → sudo -u ubuntu 로 평소 운영 계정으로 실행 (bash -l: docker 그룹 반영)
          remote="sudo -u ubuntu bash -lc '$joined'"
          echo "서버에서 실행할 명령: $remote"
          params=$(jq -nc --arg c "$remote" '{commands: [$c], executionTimeout: ["1800"]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions deploy run ${{ github.run_id }}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $command_id"

      # 4) 명령이 끝날 때까지 기다린다 (aws ssm wait는 최대 100초라 빌드 시간엔 부족 → 직접 폴링)
      - name: Wait for SSM command
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          status=Pending
          for i in $(seq 1 120); do   # 최대 20분 (10초 x 120)
            sleep 10
            # 보낸 직후엔 InvocationDoesNotExist가 날 수 있어서 실패해도 계속 기다린다
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            echo "[$((i*10))s] $status"
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          echo "::group::서버 출력 (stdout 마지막 80줄)"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -n 80 || true
          echo "::endgroup::"
          echo "::group::서버 오류 출력 (stderr 마지막 40줄)"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text | tail -n 40 || true
          echo "::endgroup::"

          if [ "$status" != "Success" ]; then
            echo "::error::SSM 배포 명령 상태: $status"; exit 1
          fi

          # 서버가 실제로 원하는 커밋에 있는지 확인 (SHA를 지정했을 때)
          deployed=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                       --query StandardOutputContent --output text | sed -n 's/^DEPLOYED_SHA=//p' | tail -n 1)
          echo "서버 HEAD: $deployed"
          if [ "$TARGET" != main ] && [ "${deployed#"$TARGET"}" = "$deployed" ]; then
            echo "::error::서버 HEAD($deployed)가 배포 대상($TARGET)과 다릅니다"; exit 1
          fi

      # 5) 밖(인터넷)에서 실제로 응답하는지 확인. 재시작 직후일 수 있어 몇 번 재시도
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)
            echo "[$i] HTTP $code $(cat /tmp/health.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::$HEALTH_URL 가 200을 돌려주지 않습니다"; exit 1
