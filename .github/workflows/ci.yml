name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # 통합 테스트(쿠폰 동시성, 리프레시 토큰 회전)와 API 스모크 테스트용 실제 MySQL
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: backend_visualized
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      # 6장 캐시 통합 테스트(cache stampede)용 실제 Redis
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:3306/backend_visualized
      REDIS_URL: redis://127.0.0.1:6379/0
      # DB가 없으면 통합 테스트를 skip 하지 말고 실패시킨다
      REQUIRE_DATABASE: 'true'
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 버전은 package.json의 packageManager에서 읽음
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma Client 타입은 생성 코드라 typecheck 전에 만들어야 한다 (로컬은 이미 생성돼 있어 드러나지 않음)
      - name: Generate Prisma Client
        run: pnpm --filter @bv/api prisma:generate
      - name: Apply migrations
        run: pnpm --filter @bv/api exec prisma migrate deploy
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test API in production mode
        env:
          NODE_ENV: production
          PORT: '4000'
          WEB_ORIGIN: https://ci.example.com
          JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
          ADMIN_API_KEY: ci-only-admin-key-0123456789
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4000/admin/aggregate)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Admin-Api-Key: ci-only-admin-key-0123456789' http://127.0.0.1:4000/admin/aggregate)" = 201
      - name: API log
        if: always()
        run: cat api.log || true

  docker-image:
    name: API Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: backend-visualized-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
